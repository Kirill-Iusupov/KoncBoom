# Прод за Cloudflare Tunnel (docker-compose.prod.yml).
# TLS делает Cloudflare, cloudflared ходит сюда по http:// и передаёт
# X-Forwarded-Proto: https — его нужно пробросить в Django как есть,
# иначе SECURE_SSL_REDIRECT уйдёт в бесконечный редирект на HTTPS.

# Все запросы приходят от контейнера cloudflared, поэтому $remote_addr у всех
# один и тот же. Реальный IP посетителя — в CF-Connecting-IP.
map $http_cf_connecting_ip $client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

limit_req_zone $client_ip zone=api_limit:10m rate=10r/s;

upstream django_backend {
    server backend:8000;
}

upstream nextjs_frontend {
    server frontend:3000;
}

# Один канонический адрес: абсолютные URL картинок из API строятся по Host
server {
    listen 80;
    server_name www.kantsbum.shop;
    return 301 https://kantsbum.shop$request_uri;
}

server {
    listen 80 default_server;
    server_name kantsbum.shop;

    client_max_body_size 10M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
    }

    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 30s;
    }

    location /admin {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location / {
        proxy_pass http://nextjs_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
